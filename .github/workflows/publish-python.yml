# Publishes the chaturbate-mcp package to PyPI via a Trusted Publisher (OIDC).
# Mirrors Heretek-AI/heretek-swarm .github/workflows/publish-python.yml, with an
# added offline pytest gate before publishing.
#
# Trigger: push a tag like `v0.1.0` (must match the `version` in pyproject.toml),
# or run manually from the Actions tab (still subject to the version check).
#
# The PyPI trusted publisher for this project must be registered with:
#   Project: chaturbate-mcp · Owner: Heretek-AI · Repository: chaturbate-mcp
#   Workflow name: publish-python.yml · Environment: pypi
name: Publish Python Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Offline test gate — a failing suite blocks publishing.
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest -q

  build:
    name: Build Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "tag_version=$TAG_VERSION"

      - name: Validate version matches pyproject.toml
        run: |
          FILE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "FILE_VERSION=$FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "ERROR: Tag version '$TAG_VERSION' does not match pyproject.toml version '$FILE_VERSION'"
            echo "Update pyproject.toml to version '$TAG_VERSION' and push a new tag."
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Build package
        run: uv build --out-dir dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and smoke-test wheel
        run: |
          pip install --force-reinstall dist/*.whl
          python -c "import chaturbate_mcp; from chaturbate_mcp.server import build_server; build_server(); print('wheel OK', chaturbate_mcp.__version__)"

      - name: Install and smoke-test sdist
        run: |
          pip install --force-reinstall dist/*.tar.gz
          python -c "import chaturbate_mcp; print('sdist OK', chaturbate_mcp.__version__)"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, test-install, tests]
    environment:
      name: pypi
      url: https://pypi.org/project/chaturbate-mcp
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
